name: AWS CLI Validation

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ "feature_stg_001" ]  # 推送到main分支时触发

jobs:
  validate-awscli:
    runs-on: ubuntu-latest  # 推荐使用Linux环境
    
    steps:
    # 步骤1：检出代码（标准操作）
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-1

    # 步骤3：执行验证命令（示例命令）
    - name: Test AWS CLI Connectivity
      run: |
        # 验证基础命令
        aws sts get-caller-identity  # 确认凭证有效性
        
        # Glue相关测试（按需修改）
        aws glue list-jobs --max-results 5  # 列出前5个Glue作业
        
        # S3测试（示例）
        aws s3 ls s3://ndit-skillup-bedrock-video-trans-s3b  # 列出测试桶内容

    # 步骤4：清理资源（按需添加）
    - name: Cleanup
      if: always()  # 无论成功失败都执行
      run: echo "清理临时文件..."
